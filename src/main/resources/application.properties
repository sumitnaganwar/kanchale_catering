
spring.application.name=kanchale-catering

# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration (Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kanchale_catering}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File Upload Configuration
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Admin Configuration
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}

