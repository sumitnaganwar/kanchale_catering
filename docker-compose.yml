services:
  postgres:
    image: postgres:16-alpine
    container_name: kanchale-postgres
    environment:
      POSTGRES_DB: kanchale_catering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kanchale-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanchale_catering"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kanchale-postgres-data:
